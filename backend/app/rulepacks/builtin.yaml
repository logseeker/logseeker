# LogSeeker 同梱ルールパック（書式: docs/rulepack.md）
#
# - 条件に書ける key は Taxonomy KEY のみ（docs/taxonomy.md）。照合は大文字小文字を区別しない。
# - col は正規化済みの列（rulepack.COLS）。scope は col だけで書き、payload を展開する前に対象を絞る。
# - 値の比較は大文字小文字を区別せず、前後の空白を除く。空文字と "-" は「値なし」として扱う。
# - 正規表現は PostgreSQL の ~*（大文字小文字を区別しない）で評価する。\b は使えない。
format: 1
pack: builtin
version: "2026.10.23-1"

rules:
  # ================================================================ Windows（windows_event）
  # docs/detection-rules.md §14。taxonomy.md v1.13 で追加したKEYを使う。

  - id: win_log_cleared
    name: "[Windows] 監査ログの消去"
    title: 監査ログの消去
    severity: critical
    category: security
    description: Securityログ(1102)またはSystemログ(104)が消去された。侵入後の痕跡隠しで典型的に行われる。
    recommendation: >-
      消去した操作者（アカウント）と時刻を確認し、心当たりが無ければ侵害を前提に調査。消去前後のログオン・プロセス起動を確認し、本システム側に転送済みの記録を保全する。
    scope: {source_type: windows_event, event_action: ["1102", "104"]}
    match:
      any:
        - {col: event_action, eq: "1102"}
        - all:
            - {col: event_action, eq: "104"}
            - {key: channel, eq: system}
    group_by: [host_name]
    evidence:
      - {label: 操作者, key: subjectusername}

  - id: win_pass_the_hash
    name: "[Windows] Pass-the-Hashの疑い"
    title: Pass-the-Hashの疑い
    severity: high
    category: security
    description: >-
      パスワードではなく盗んだNTLMハッシュでのログオンを示す形跡（4624: ネットワークログオン(3)+NTLM+セッションキー長0、または LogonType 9 + seclogo）。ドメイン非参加の環境では正規のログオンでも出ることがある。
    recommendation: >-
      該当アカウントのパスワードをリセットし、送信元端末を隔離して調査。ローカル管理者パスワードの使い回しを避ける（LAPS）。NTLMの利用制限を検討。
    scope: {source_type: windows_event, event_action: ["4624"]}
    match:
      any:
        - all:
            - {key: logontype, eq: "3"}
            - {key: authenticationpackagename, eq: NTLM}
            - {key: keylength, eq: "0"}
            - {key: targetusername, ne: ANONYMOUS LOGON}
        - all:
            - {key: logontype, eq: "9"}
            - {key: logonprocessname, eq: seclogo}
    group_by: [source_ip, host_name]
    evidence:
      - {label: 対象アカウント, key: targetusername}
      - {label: ログオン先, col: host_name}

  - id: win_suspicious_command
    name: "[Windows] 不審なコマンド実行"
    title: 不審なコマンド実行
    severity: high
    category: security
    description: >-
      プロセス作成(4688)で、エンコード済みPowerShell・資格情報窃取ツール・シャドウコピー削除・イベントログ消去など、攻撃でよく使われるコマンドを検出。コマンドラインの記録には監視対象側の監査ポリシー設定が必要。
    recommendation: >-
      実行したアカウント・親プロセスを確認し、正規の管理作業でなければ端末を隔離して調査。シャドウコピー削除・回復の無効化はランサムウェアの直前動作のことが多いので最優先で対応。
    scope: {source_type: windows_event, event_action: ["4688"]}
    match:
      # CommandLine は監視対象で「プロセス作成イベントにコマンドラインを含める」を有効にしないと出ない。
      # 未設定でも NewProcessName（実行ファイルパス）でツール名だけは拾える。
      key: [commandline, newprocessname]
      regex:
        - 'powershell.*\s-(e|ec|enc|encodedcommand)\s'          # エンコード済みコマンドの実行
        - 'frombase64string'
        - 'downloadstring|downloadfile|invoke-webrequest|invoke-expression|iex\s*\('
        - 'mimikatz|sekurlsa|lsadump|kerberos::'                 # 資格情報窃取ツール
        - 'comsvcs(\.dll)?.*minidump|procdump.*lsass'            # LSASSのメモリダンプ
        - 'vssadmin(\.exe)?\s+delete\s+shadows|wmic(\.exe)?\s+shadowcopy\s+delete|wbadmin(\.exe)?\s+delete'
        - 'bcdedit(\.exe)?\s+/set'                               # 回復の無効化（ランサムウェアの典型）
        - 'wevtutil(\.exe)?\s+cl\s'                              # イベントログの消去
        - 'certutil(\.exe)?.*-urlcache|bitsadmin(\.exe)?.*/transfer'
        - 'reg(\.exe)?\s+save\s+hklm\\(sam|system|security)'     # SAM/SYSTEMハイブの持ち出し
        - 'ntdsutil'
        - 'net1?(\.exe)?\s+(user|localgroup)\s.*/add'
    group_by: [host_name]
    evidence:
      - {label: コマンド, key: [commandline, newprocessname], limit: 2, truncate: 160}
      - {label: 実行者, key: subjectusername}

  - id: win_rdp_external
    name: "[Windows] 外部IPからのRDPログオン成功"
    title: 外部IPからのRDPログオン成功
    severity: high
    category: security
    description: グローバルIPからのリモートデスクトップ(4624 LogonType 10)でログオンに成功した。
    recommendation: >-
      接続元と利用者に心当たりが無ければ該当アカウントを無効化。RDPをインターネットへ直接公開せず、VPN経由・IP制限・NLA・MFAを導入。
    scope: {source_type: windows_event, event_action: ["4624"]}
    match:
      all:
        - {key: logontype, eq: "10"}
        - {col: source_ip, ip_global: true}
    group_by: [source_ip]
    evidence:
      - {label: アカウント, col: actor_user}
      - {label: ログオン先, col: host_name}

  - id: win_logon_failure_ip
    name: "[Windows] ログオン失敗の多発（送信元IP単位）"
    title: ログオン失敗の多発
    severity: high
    category: security
    description: 同一送信元IPからのWindowsログオン失敗(4625)が多発。
    recommendation: 該当IPを遮断。RDP/SMBの外部公開を見直し、アカウントロックアウトポリシーを設定。
    scope: {source_type: windows_event, event_action: ["4625"]}
    match: {col: source_ip, exists: true}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 対象アカウント数, col: actor_user, show: count}
      - {label: 対象アカウント, col: actor_user}

  - id: win_password_spray
    name: "[Windows] パスワードスプレーの疑い"
    title: パスワードスプレーの疑い
    severity: high
    category: security
    description: >-
      同一送信元IPから、多数の異なるアカウントへのログオン失敗(4625)。ロックアウトを避けて少数のパスワードを多数のアカウントに試す攻撃。
    recommendation: 該当IPを遮断。狙われたアカウントに弱いパスワードが無いか確認し、MFAを導入。
    scope: {source_type: windows_event, event_action: ["4625"]}
    match: {col: source_ip, exists: true}
    group_by: [source_ip]
    threshold: {distinct: {col: actor_user}, min_distinct: 5}
    evidence:
      - {label: 対象アカウント数, col: actor_user, show: count}
      - {label: 対象アカウント, col: actor_user}

  - id: win_kerberoasting
    name: "[Windows] Kerberoastingの疑い"
    title: Kerberoastingの疑い
    severity: high
    category: security
    description: >-
      RC4暗号(0x17)のKerberosサービスチケット要求(4769)。サービスアカウントのパスワードをオフラインで解読する攻撃で使われる（ドメインコントローラーのログでのみ出る）。
    recommendation: >-
      要求元のアカウント・端末を確認。サービスアカウントは25文字以上の長いパスワードかgMSAにし、RC4を無効化してAESのみにする。
    scope: {source_type: windows_event, event_action: ["4769"]}
    match:
      all:
        - {key: ticketencryptiontype, eq: "0x17"}
        - not: {key: servicename, endswith: "$"}   # コンピューターアカウント宛ては対象外
        - {key: servicename, ne: krbtgt}
    group_by: [source_ip, host_name]
    evidence:
      - {label: 要求されたサービス, key: servicename}
      - {label: 要求元, col: actor_user}

  - id: win_priv_group_add
    name: "[Windows] 特権グループへのメンバー追加"
    title: 特権グループへのメンバー追加
    severity: high
    category: security
    description: Administrators・Domain Admins・Remote Desktop Users 等の特権グループにメンバーが追加された(4728/4732/4756)。
    recommendation: 追加した操作者と追加されたアカウントを確認し、承認された変更でなければ直ちに取り消して調査。
    scope: {source_type: windows_event, event_action: ["4728", "4732", "4756"]}
    match:
      # 対象グループ名。日本語版Windowsでも組み込みグループ名は英語のまま
      key: targetusername
      regex: 'admins|administrators|operators|remote desktop users|remote management users|group policy creator owners'
    group_by: [host_name]
    evidence:
      - {label: グループ, key: targetusername}
      - {label: 追加されたメンバー, key: [membername, membersid]}
      - {label: 操作者, key: subjectusername}

  - id: win_account_created
    name: "[Windows] ユーザーアカウントの作成"
    title: ユーザーアカウントの作成
    severity: warning
    category: security
    description: ユーザーアカウントが作成された(4720)。攻撃者の永続化（裏口アカウント）でも使われる。
    recommendation: 作成者と作成されたアカウントが承認済みの作業か確認。心当たりが無ければ無効化して調査。
    scope: {source_type: windows_event, event_action: ["4720"]}
    group_by: [host_name]
    evidence:
      - {label: 作成されたアカウント, key: targetusername}
      - {label: 操作者, key: subjectusername}

  - id: win_service_installed
    name: "[Windows] サービスのインストール"
    title: サービスのインストール
    severity: warning
    category: security
    description: 新しいサービスがインストールされた(7045/4697)。PsExec等の横展開やマルウェアの永続化で使われる。
    recommendation: >-
      サービス名・実行ファイルパスを確認。一時フォルダ・ユーザーフォルダ上の実行ファイルや、cmd/powershellを直接起動するサービスは要注意。
    scope: {source_type: windows_event, event_action: ["7045", "4697"]}
    group_by: [host_name]
    evidence:
      - {label: サービス, key: servicename, limit: 2}
      - {label: 実行パス, key: imagepath, limit: 2}

  - id: win_scheduled_task
    name: "[Windows] タスクスケジューラへの登録"
    title: タスクスケジューラへの登録
    severity: warning
    category: security
    description: スケジュールされたタスクが作成された(4698)。マルウェアの永続化・遠隔実行で使われる。
    recommendation: タスク名と実行内容を確認し、承認されていない登録であれば削除して調査。
    scope: {source_type: windows_event, event_action: ["4698"]}
    group_by: [host_name]
    evidence:
      - {label: タスク, key: taskname}
      - {label: 登録者, key: subjectusername}

  - id: win_audit_policy_changed
    name: "[Windows] 監査ポリシーの変更"
    title: 監査ポリシーの変更
    severity: warning
    category: security
    description: システムの監査ポリシーが変更された(4719)。検知を逃れるために監査を無効化する攻撃がある。
    recommendation: 変更者と変更内容を確認し、意図しない変更であれば元に戻す。
    scope: {source_type: windows_event, event_action: ["4719"]}
    group_by: [host_name]
    evidence:
      - {label: 操作者, key: subjectusername}

  # ================================================================ GitLab（source=gitlab）
  # GitLab（Omnibus）のJSONログを NXLog から source=gitlab, class=gitlab で送る前提。
  # GitLabのイベントは source_type が付かない（判定ルールが無い）ため scope は source で絞る。
  # class で絞ると payload を全行展開することになり、受信量の多いGitLabでは重すぎる。
  # 下の3ルールは taxonomy.md v1.13 までのKEYだけで書いたもの（送信元IP単位の集約はしない）。

  - id: gitlab_failed_login
    name: "[GitLab] ログイン失敗の多発"
    title: GitLabのログイン失敗の多発
    severity: warning
    category: security
    description: >-
      GitLabへのログイン失敗（application_json.log の「Failed Login: username=… ip=…」）が多発している。パスワードの総当たりやパスワードスプレーの可能性がある。
    recommendation: >-
      証跡のユーザー名・IPを確認し、心当たりの無いIPからであれば遮断する。狙われているアカウントには2要素認証を必須にし、GitLabの「サインイン失敗時のロック」とRack Attackの制限が有効か確認する。
    scope: {source: gitlab}
    match: {key: message, startswith: "Failed Login:"}
    group_by: [source]
    threshold: {count: 5}
    evidence:
      - {label: 失敗内容, key: message, limit: 5, truncate: 120}
      - {label: 種類, key: message, show: count}

  - id: gitlab_server_error_burst
    name: "[GitLab] サーバエラー(5xx)の多発"
    title: GitLabのサーバエラー(5xx)の多発
    severity: warning
    category: operations
    description: GitLab（Rails・Workhorse・API）が5xxを多数返している。障害・リソース不足・依存サービス（DB/Redis/Gitaly）の停止の可能性がある。
    recommendation: >-
      gitlab-ctl status で各サービスの稼働を確認し、エラーの出ているURIと同時刻の ERROR ログから原因を特定する。ディスク・メモリの残量も確認する。
    scope: {source: gitlab}
    match:
      any:
        # Rails（production_json / api_json）・Workhorse は status にステータスコードが入る
        - {key: [status, statuscode], regex: '^5[0-9][0-9]$'}
        # nginx（gitlab_access.log）はJSONでなく1行がそのまま message に入る（"GET / HTTP/1.1" 502 ...）
        - {key: message, regex: 'HTTP/[0-9.]+" 5[0-9][0-9] '}
    group_by: [source]
    threshold: {count: 20}
    evidence:
      - {label: ステータス, key: [status, statuscode]}
      - {label: URI, key: uri, limit: 5, truncate: 120}
      - {label: nginx, key: message, limit: 3, truncate: 120}

  - id: gitlab_error_burst
    name: "[GitLab] ERRORログの多発"
    title: GitLabのERRORログの多発
    severity: warning
    category: operations
    description: GitLabの各コンポーネント（Rails・Sidekiq・Workhorse・Gitaly等）が ERROR / FATAL のログを多数出している。
    recommendation: >-
      証跡のメッセージから該当コンポーネントを特定し、gitlab-ctl tail で前後のログを確認する。バックグラウンドジョブ（Sidekiq）の失敗が続く場合は、ジョブのキュー滞留も確認する。
    scope: {source: gitlab}
    # Rails・Sidekiq は severity（ERROR）、Workhorse・Gitaly は level（error）にレベルが入る
    match: {key: [severity, level], in: [error, fatal]}
    group_by: [source]
    threshold: {count: 20}
    evidence:
      - {label: メッセージ, key: [message, msg], limit: 5, truncate: 120}
      - {label: 種類, key: [message, msg], show: count}

  # ---- 以下は taxonomy.md v1.14（GitLabのKEY追加）で使えるようになったKEYを使う。
  # remote_ip / ip_address / meta.remote_ip は正規化で source_ip に入るため、送信元IP単位で集約できる。
  # 対象ログ（audit_json / auth_json / production_json / api_json / Sidekiq）は NXLog で送る設定が必要。

  - id: gitlab_failed_login_ip
    name: "[GitLab] 同一IPからのログイン失敗の連続"
    title: GitLabへのログイン失敗の連続
    severity: high
    category: security
    description: >-
      同じ送信元IPからGitLabへのログイン失敗（audit_json.log の failed_login）が10件以上。パスワードの総当たりの可能性が高い。audit_json.log を送信していないと発火しない。
    recommendation: >-
      送信元IPを遮断し、狙われたアカウントのパスワード変更と2要素認証の有効化を確認する。GitLabの「サインイン失敗時のロック」とRack Attack（管理エリア > 設定 > ネットワーク > ユーザーとIPのレート制限）が有効か確認する。
    scope: {source: gitlab}
    match: {key: failed_login, exists: true}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 対象アカウント, key: [author_name, target_details], limit: 5}
      - {label: 認証方式, key: failed_login}

  - id: gitlab_password_spray
    name: "[GitLab] パスワードスプレーの疑い"
    title: GitLabへのパスワードスプレーの疑い
    severity: high
    category: security
    description: >-
      同じ送信元IPから、5個以上の異なるアカウントへのログイン失敗（audit_json.log の failed_login）。よくあるパスワードを多数のアカウントに試す攻撃の可能性がある。
    recommendation: >-
      送信元IPを遮断し、対象アカウントに弱いパスワードが無いか確認する。全ユーザーへの2要素認証の必須化を検討する。
    scope: {source: gitlab}
    match: {key: failed_login, exists: true}
    group_by: [source_ip]
    threshold: {distinct: {key: [author_name, target_details]}, min_distinct: 5}
    evidence:
      - {label: 対象アカウント, key: [author_name, target_details], limit: 5}
      - {label: アカウント数, key: [author_name, target_details], show: count}

  - id: gitlab_rack_attack
    name: "[GitLab] レート制限・遮断の発動"
    title: GitLabのレート制限・遮断の発動
    severity: warning
    category: security
    description: >-
      GitLabのRack Attack（auth_json.log）が、同じ送信元IPに対してレート制限（throttle）または遮断（blocklist）を10回以上発動した。総当たり・スクレイピング・過剰なAPI呼び出しの可能性がある。CI等の正規の大量アクセスでも出ることがある。
    recommendation: >-
      送信元IPと一致した制限名（matched）を確認する。社内のCIや連携ツールなら制限値の調整を、心当たりが無ければ送信元IPの遮断を検討する。
    scope: {source: gitlab}
    match: {key: env, in: [throttle, blocklist]}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 一致した制限, key: matched}
      - {label: パス, key: path, limit: 5, truncate: 120}

  - id: gitlab_api_auth_failure
    name: "[GitLab] APIの認証失敗の多発"
    title: GitLab APIの認証失敗の多発
    severity: warning
    category: security
    description: >-
      同じ送信元IPから、GitLab API（/api/）への 401（未認証）/ 403（権限なし）が20件以上。アクセストークンの総当たりや、失効したトークンを使い続けている連携ツールの可能性がある。
    recommendation: >-
      送信元IPとUser-Agentから送信元を特定する。社内のツールならトークンを更新し、心当たりが無ければ送信元IPを遮断する。
    scope: {source: gitlab}
    match:
      all:
        - {key: path, startswith: /api/}
        - {key: status, in: ["401", "403"]}
    group_by: [source_ip]
    threshold: {count: 20}
    evidence:
      - {label: ステータス, key: status}
      - {label: パス, key: [route, path], limit: 5, truncate: 120}
      - {label: User-Agent, key: [ua, user_agent], limit: 3, truncate: 120}

  - id: gitlab_admin_external
    name: "[GitLab] 外部IPからの管理エリアへのアクセス"
    title: 外部IPからのGitLab管理エリアへのアクセス
    severity: warning
    category: security
    description: >-
      グローバルIPから GitLab の管理エリア（/admin）へのアクセスがあった。管理者アカウントが乗っ取られている場合や、管理画面が外部に公開されている場合に出る。管理者が社外から正規に操作した場合も出る。
    recommendation: >-
      アクセスしたユーザーと送信元IPが想定どおりか確認する。管理エリアは社内ネットワークやVPN経由に限定することを検討する。
    scope: {source: gitlab}
    match:
      all:
        - {key: path, startswith: /admin}
        - {col: source_ip, ip_global: true}
    group_by: [source_ip]
    evidence:
      - {label: ユーザー, key: [username, meta.user], limit: 3}
      - {label: パス, key: path, limit: 5, truncate: 120}
      - {label: ステータス, key: status}

  - id: gitlab_job_failed
    name: "[GitLab] バックグラウンドジョブの失敗の多発"
    title: GitLabのバックグラウンドジョブ(Sidekiq)の失敗の多発
    severity: warning
    category: operations
    description: GitLabのバックグラウンドジョブ（Sidekiq）の失敗（job_status=fail）が10件以上。メール送信・CI・ミラー・ハウスキーピング等が止まっている可能性がある。
    recommendation: >-
      証跡の例外クラスから原因を確認する。管理エリア > モニタリング > バックグラウンドジョブ で失敗・再試行待ちのジョブを確認し、Redis・DB・ディスクの状態も確認する。
    scope: {source: gitlab}
    match: {key: job_status, eq: fail}
    group_by: [source]
    threshold: {count: 10}
    evidence:
      - {label: 例外, key: exception.class, limit: 5}
      - {label: メッセージ, key: [message, exception.message], limit: 3, truncate: 120}

  # ================================================================ Microsoft 365（m365_audit）
  # M365コネクタ（m365_connector.py）・CSV取り込みツール（tools/import_m365_csv.py）で取り込んだ統合監査ログ。
  # コネクタ・CSVツールが送信元として監査レコードを既存KEY（action=Operation・username=UserId・
  # srcipv4/srcipv6=ClientIP等・service=Workload・errorcode=ErrorNumber・objectname=ObjectId 等）で組み立て、
  # レコード全体を rawmsg に残す（taxonomy.md v1.15 §6.8。KEYの追加は無い）。既存KEYに対応の無い値
  # （OperationProperties・Verdict 等）は rawmsg を正規表現で見る。rawmsg は区切りに空白の無いJSON。
  # 正規化で event_action・actor_user・source_ip・service_name が入るので、scope は列で絞れる。
  # UserLoginFailed の event_result=failure は資格情報の失敗（パスワード誤り・ロック・MFA拒否等）だけ。
  # MFAを求めるための中断（50074）等は unknown なので、正規のMFA付きサインインでは発火しない。

  - id: m365_password_spray
    name: "[M365] パスワードスプレーの疑い"
    title: M365へのパスワードスプレーの疑い
    severity: high
    category: security
    description: >-
      同じ送信元IPから、5つ以上のアカウントでパスワード誤り等のサインイン失敗が出ている。よく使われるパスワードを多数のアカウントに少しずつ試す攻撃（パスワードスプレー）の典型。
    recommendation: >-
      送信元IPが自社・既知の拠点か確認し、心当たりが無ければ条件付きアクセス（ネームドロケーション）で遮断する。狙われたアカウントのMFA登録状況と、同じIPからのサインイン成功（UserLoggedIn）が無いか確認する。
    scope: {source_type: m365_audit, event_action: [UserLoginFailed]}
    match: {col: event_result, eq: failure}
    group_by: [source_ip]
    threshold: {distinct: {col: actor_user}, min_distinct: 5}
    evidence:
      - {label: 対象アカウント, col: actor_user, limit: 5}
      - {label: アカウント数, col: actor_user, show: count}
      - {label: エラー, key: failurereason}

  - id: m365_mfa_failed
    name: "[M365] MFAの失敗・拒否の繰り返し"
    title: M365のMFAの失敗・拒否の繰り返し
    severity: high
    category: security
    description: >-
      パスワードは通ったが、MFA（多要素認証）で失敗・拒否が3回以上続いている（エラー500121）。パスワードが漏れており、攻撃者がMFAの承認を求め続けている（MFA疲労攻撃）可能性がある。
    recommendation: >-
      本人に心当たりを確認する。身に覚えが無ければ直ちにパスワードを変更し、サインインセッションを取り消す。Authenticatorの番号の一致（number matching）が有効か確認する。
    scope: {source_type: m365_audit, event_action: [UserLoginFailed]}
    match: {key: errorcode, eq: "500121"}
    group_by: [actor_user]
    threshold: {count: 3}
    evidence:
      - {label: 送信元IP, col: source_ip, limit: 5}

  - id: m365_foreign_signin
    name: "[M365] 海外からのサインイン"
    title: M365への海外からのサインイン
    severity: high
    category: security
    description: >-
      日本以外の国のIPから Microsoft 365 へのサインインに成功した（GeoIPによる国の判定。GeoLite2-Country.mmdb を置いていない環境では働かない）。
    recommendation: >-
      本人の出張・VPN・海外拠点からの利用か確認する。心当たりが無ければパスワードを変更してサインインセッションを取り消し、条件付きアクセスで国外からのサインインを制限する。
    scope: {source_type: m365_audit, event_action: [UserLoggedIn]}
    match:
      all:
        - {col: source_country, exists: true}
        - {col: source_country, ne: JP}
    group_by: [actor_user]
    evidence:
      - {label: 国, col: source_country}
      - {label: 送信元IP, col: source_ip, limit: 5}

  - id: m365_inbox_rule_forward
    name: "[M365] 転送・削除をする受信トレイルール"
    title: 転送・削除をする受信トレイルールの作成
    severity: high
    category: security
    description: >-
      メールを転送・リダイレクトする、または受信したメールを削除する受信トレイルールが作成・変更された。メールを乗っ取った攻撃者が、やり取りを盗み見たり警告メールを隠したりするために作る典型的な手口。
    recommendation: >-
      本人が作ったルールか確認する。心当たりが無ければルールを削除し、パスワード変更・サインインセッションの取り消し・MFAの確認を行う。転送先のアドレスへ既に送られたメールが無いか確認する。
    scope: {source_type: m365_audit, event_action: [New-InboxRule, Set-InboxRule, UpdateInboxRules]}
    match:
      any:
        # New-InboxRule / Set-InboxRule（PowerShell・OWA）は Parameters に引数名が入る
        - {key: parameters, regex: '"(ForwardTo|ForwardAsAttachmentTo|RedirectTo|DeleteMessage|SoftDeleteMessage)"'}
        # UpdateInboxRules（Outlookクライアント）は OperationProperties の RuleActions に動作の種類が入る（rawmsg）
        - {key: rawmsg, regex: 'ActionType[^A-Za-z]+(Forward|Redirect|Delete|PermanentDelete)'}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 送信元IP, col: source_ip}

  - id: m365_inbox_rule_change
    name: "[M365] 受信トレイルールの作成・変更"
    title: 受信トレイルールの作成・変更
    severity: info
    category: security
    description: 受信トレイルール（仕分けルール）が作成・変更された。転送・削除をするものは別のルール（high）で知らせる。
    recommendation: 普段ルールを作らない利用者や、心当たりの無い時間帯・送信元IPからの変更であれば、本人に確認する。
    scope: {source_type: m365_audit, event_action: [New-InboxRule, Set-InboxRule, UpdateInboxRules]}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 送信元IP, col: source_ip}

  - id: m365_mailbox_forwarding
    name: "[M365] メールボックスの自動転送の設定"
    title: メールボックスの自動転送の設定
    severity: high
    category: security
    description: >-
      Set-Mailbox でメールボックスの転送先（ForwardingSmtpAddress / ForwardingAddress）が設定された。届いたメールがすべて転送先へ送られる。
    recommendation: >-
      転送先のアドレスと設定した操作者を確認する。心当たりが無ければ転送を解除し、操作者のアカウントの侵害を疑って調査する。組織外への自動転送は送信スパムフィルターのポリシーで止められる。
    scope: {source_type: m365_audit, event_action: [Set-Mailbox]}
    match: {key: parameters, regex: 'Forwarding(Smtp)?Address", "Value": "[^"]'}
    group_by: [actor_user]
    evidence:
      - {label: 対象, key: objectname}
      - {label: 送信元IP, col: source_ip}

  - id: m365_transport_rule
    name: "[M365] メールフロールールの作成・変更"
    title: メールフロールール（トランスポートルール）の作成・変更
    severity: warning
    category: security
    description: >-
      組織全体のメールに適用されるメールフロールール（トランスポートルール）が作成・変更・削除された。組織のメールをまとめて外部へ転送する、警告を消す等に悪用されることがある。
    recommendation: 変更した管理者と内容（Parameters）を確認し、予定された変更でなければ元に戻す。
    scope: {source_type: m365_audit, event_action: [New-TransportRule, Set-TransportRule, Remove-TransportRule, Enable-TransportRule, Disable-TransportRule]}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 対象, key: objectname}

  - id: m365_mailbox_permission
    name: "[M365] メールボックスのアクセス権の付与"
    title: メールボックスのアクセス権の付与
    severity: warning
    category: security
    description: >-
      他人のメールボックスへのフルアクセス・送信者としての送信（SendAs）の権限が付与された。Exchangeのシステム処理（NT SERVICE\…）による付与は除く。
    recommendation: 付与した管理者と付与先・対象のメールボックスを確認し、業務上の理由が無ければ権限を外す。
    scope: {source_type: m365_audit, event_action: [Add-MailboxPermission, Add-RecipientPermission]}
    match:
      not: {col: actor_user, startswith: NT SERVICE}
    group_by: [actor_user]
    evidence:
      - {label: 対象, key: objectname}
      - {label: 内容, key: parameters, truncate: 200}

  - id: m365_admin_role
    name: "[M365] 管理者ロールの付与"
    title: Entra IDの管理者ロールの付与
    severity: high
    category: security
    description: >-
      Entra ID の管理者ロール（グローバル管理者等）にメンバーが追加された。乗っ取ったアカウントに権限を与える・裏口の管理者を作るといった侵害後の典型的な操作。
    recommendation: >-
      付与した管理者・付与されたユーザー・ロールを確認し、予定された変更でなければ直ちに取り消す。管理者ロールは必要最小限の人数にし、Privileged Identity Management での一時付与を検討する。
    scope: {source_type: m365_audit, event_action: ["Add member to role.", "Add eligible member to role.", "Add scoped member to role."]}
    group_by: [actor_user]
    evidence:
      - {label: 対象, key: objectname}
      - {label: 内容, key: modifiedproperties, truncate: 200}

  - id: m365_app_consent
    name: "[M365] アプリへの同意"
    title: アプリへのアクセス許可の同意
    severity: warning
    category: security
    description: >-
      アプリにテナントのデータ（メール・ファイル・チャット等）へのアクセス許可が与えられた（Consent to application）。不正なアプリに同意させてデータを抜き取る手口（同意フィッシング）がある。
    recommendation: >-
      同意したユーザーとアプリ、許可の範囲（証跡の内容の Scope）を確認する。心当たりの無いアプリは Entra 管理センターの「エンタープライズ アプリケーション」から削除し、ユーザーによる同意を管理者承認制にすることを検討する。
    scope: {source_type: m365_audit, event_action: ["Consent to application."]}
    group_by: [actor_user]
    evidence:
      - {label: アプリ（ID）, key: objectname, limit: 5}

  - id: m365_app_credential
    name: "[M365] アプリへの資格情報の追加"
    title: アプリへのシークレット・証明書の追加
    severity: warning
    category: security
    description: アプリ（サービスプリンシパル）にクライアントシークレット・証明書が追加された。既存のアプリに裏口の資格情報を足して、パスワード変更後もアクセスし続ける手口がある。
    recommendation: 追加した管理者と対象のアプリを確認し、予定された作業でなければ追加された資格情報を削除する。
    scope: {source_type: m365_audit, event_action: ["Add service principal credentials.", "Update application – Certificates and secrets management"]}
    group_by: [actor_user]
    evidence:
      - {label: 対象, key: objectname}

  - id: m365_user_admin
    name: "[M365] ユーザーの追加・削除・パスワードリセット"
    title: ユーザーの追加・削除・パスワードリセット
    severity: info
    category: security
    description: Entra ID でユーザーの追加・削除、または管理者によるパスワードのリセットが行われた。
    recommendation: 予定された作業か確認する。心当たりの無いユーザーの追加は、侵害後の裏口アカウントの可能性がある。
    scope: {source_type: m365_audit, event_action: ["Add user.", "Delete user.", "Reset user password.", "Set force change user password."]}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 対象, key: objectname, limit: 5}

  - id: m365_ca_policy
    name: "[M365] 条件付きアクセスの変更"
    title: 条件付きアクセスのポリシーの変更
    severity: warning
    category: security
    description: >-
      条件付きアクセスのポリシー（MFAの要求・国外からのブロック等）が追加・変更・削除された。防御を弱める変更が侵害後に行われることがある。Exchangeのシステム処理（Set-ConditionalAccessPolicy）は含まない。
    recommendation: 変更した管理者と変更内容を確認し、予定された変更でなければ元に戻す。
    scope: {source_type: m365_audit, event_action: ["Add conditional access policy.", "Update conditional access policy.", "Delete conditional access policy."]}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 対象, key: objectname}

  - id: m365_audit_disabled
    name: "[M365] 監査ログの無効化"
    title: 監査ログの記録の無効化
    severity: critical
    category: security
    description: >-
      統合監査ログの取り込み（UnifiedAuditLogIngestionEnabled）またはメールボックスの監査（AuditEnabled）が無効にされた、あるいは監査の対象外（AuditBypassEnabled）にされた。侵入後の痕跡隠しで行われる。
    recommendation: 直ちに設定を元に戻し、変更した管理者のアカウントの侵害を前提に調査する。無効になっていた間の操作は記録されていない。
    scope: {source_type: m365_audit, event_action: [Set-AdminAuditLogConfig, Set-Mailbox, Set-MailboxAuditBypassAssociation, Set-OrganizationConfig]}
    match:
      any:
        - {key: parameters, regex: '"(UnifiedAuditLogIngestionEnabled|AuditEnabled)", "Value": "False"'}
        - {key: parameters, regex: '"(AuditBypassEnabled|AuditDisabled)", "Value": "True"'}
    group_by: [actor_user]
    evidence:
      - {label: 操作, col: event_action}
      - {label: 対象, key: objectname}

  - id: m365_anonymous_link
    name: "[M365] 匿名の共有リンクの作成"
    title: 誰でも開ける共有リンクの作成
    severity: warning
    category: security
    description: SharePoint / OneDrive で、サインイン不要で誰でも開ける共有リンク（Anyone リンク）が作られた。リンクを知っていれば社外の誰でもファイルを開ける。
    recommendation: 共有したファイルと相手が業務上妥当か確認する。不要なら共有を解除し、Anyone リンクの有効期限・作成の可否を SharePoint 管理センターで制限することを検討する。
    scope: {source_type: m365_audit, event_action: [AnonymousLinkCreated, AnonymousLinkUpdated]}
    group_by: [actor_user]
    evidence:
      - {label: ファイル, key: [filename, objectname], limit: 5, truncate: 120}

  - id: m365_mass_download
    name: "[M365] ファイルの大量ダウンロード"
    title: ファイルの大量ダウンロード
    severity: warning
    category: security
    description: >-
      1人のユーザーが SharePoint / OneDrive のファイルを200件以上ダウンロードした（評価期間内。既定は直近24時間）。退職前の持ち出しや、乗っ取ったアカウントからのデータの抜き取りの可能性がある。SharePointのシステム（app@sharepoint）は除く。
    recommendation: ダウンロードしたユーザーと送信元IP・ファイルを確認する。同期クライアント（OneDrive）の初回同期でも件数が増えるため、端末の入れ替えなどの心当たりも確認する。
    scope: {source_type: m365_audit, event_action: [FileDownloaded, FileSyncDownloadedFull]}
    match: {col: actor_user, ne: app@sharepoint}
    group_by: [actor_user]
    threshold: {count: 200}
    evidence:
      - {label: 送信元IP, col: source_ip, limit: 5}
      - {label: ファイル, key: filename, limit: 5, truncate: 80}
      - {label: ファイル数, key: filename, show: count}

  - id: m365_mass_delete
    name: "[M365] ファイルの大量削除"
    title: ファイルの大量削除
    severity: warning
    category: security
    description: >-
      1人のユーザーが SharePoint / OneDrive のファイル・フォルダーを100件以上削除した（評価期間内。既定は直近24時間）。ランサムウェア・誤操作・嫌がらせの可能性がある。SharePointのシステム（SHAREPOINT\system）は除く。
    recommendation: 削除したユーザーと送信元IPを確認する。意図しない削除であれば、ごみ箱（第1段階・第2段階）から復元できる（既定で93日間）。
    scope: {source_type: m365_audit, event_action: [FileDeleted, FileRecycled, FileDeletedFirstStageRecycleBin, FileDeletedSecondStageRecycleBin, FolderDeleted, FolderRecycled, FolderDeletedFirstStageRecycleBin, FolderDeletedSecondStageRecycleBin]}
    match:
      not: {col: actor_user, startswith: SHAREPOINT}
    group_by: [actor_user]
    threshold: {count: 100}
    evidence:
      - {label: 送信元IP, col: source_ip, limit: 5}
      - {label: ファイル, key: [filename, objectname], limit: 5, truncate: 80}

  - id: m365_phish_delivered
    name: "[M365] フィッシング・マルウェアメールの配信"
    title: フィッシング・マルウェアと判定されたメールの受信トレイへの配信
    severity: high
    category: security
    description: >-
      Defender for Office 365 がフィッシング・マルウェアと判定したメールが、ブロックされずに受信トレイへ配信された（TIMailData の DeliveryAction=Delivered）。迷惑メールフォルダーへの配信（DeliveredAsSpam）とブロックは含まない。
    recommendation: 受信者がメールを開いた・リンクを押した可能性を確認し、Defender の「脅威エクスプローラー」から該当メールを削除する。同じ送信者からの他のメールも確認する。
    scope: {source_type: m365_audit, event_action: [TIMailData]}
    match:
      all:
        - {key: rawmsg, regex: '"DeliveryAction":"Delivered"'}
        - {key: rawmsg, regex: '"Verdict":"(Phish|Malware)"'}
    group_by: [source]
    evidence:
      - {label: 送信者, key: mailfrom, limit: 5}
      - {label: 件名, key: subject, limit: 3, truncate: 80}
