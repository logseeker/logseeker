# LogSeeker 同梱ルールパック（書式: docs/rulepack.md）
#
# - 条件に書ける key は Taxonomy KEY のみ（docs/taxonomy.md）。照合は大文字小文字を区別しない。
# - col は正規化済みの列（rulepack.COLS）。scope は col だけで書き、payload を展開する前に対象を絞る。
# - 値の比較は大文字小文字を区別せず、前後の空白を除く。空文字と "-" は「値なし」として扱う。
# - 正規表現は PostgreSQL の ~*（大文字小文字を区別しない）で評価する。\b は使えない。
format: 1
pack: builtin
version: "2026.10.03-1"

rules:
  # ================================================================ Windows（windows_event）
  # docs/detection-rules.md §14。taxonomy.md v1.13 で追加したKEYを使う。

  - id: win_log_cleared
    name: "[Windows] 監査ログの消去"
    title: 監査ログの消去
    severity: critical
    category: security
    description: Securityログ(1102)またはSystemログ(104)が消去された。侵入後の痕跡隠しで典型的に行われる。
    recommendation: >-
      消去した操作者（アカウント）と時刻を確認し、心当たりが無ければ侵害を前提に調査。消去前後のログオン・プロセス起動を確認し、本システム側に転送済みの記録を保全する。
    scope: {source_type: windows_event, event_action: ["1102", "104"]}
    match:
      any:
        - {col: event_action, eq: "1102"}
        - all:
            - {col: event_action, eq: "104"}
            - {key: channel, eq: system}
    group_by: [host_name]
    evidence:
      - {label: 操作者, key: subjectusername}

  - id: win_pass_the_hash
    name: "[Windows] Pass-the-Hashの疑い"
    title: Pass-the-Hashの疑い
    severity: high
    category: security
    description: >-
      パスワードではなく盗んだNTLMハッシュでのログオンを示す形跡（4624: ネットワークログオン(3)+NTLM+セッションキー長0、または LogonType 9 + seclogo）。ドメイン非参加の環境では正規のログオンでも出ることがある。
    recommendation: >-
      該当アカウントのパスワードをリセットし、送信元端末を隔離して調査。ローカル管理者パスワードの使い回しを避ける（LAPS）。NTLMの利用制限を検討。
    scope: {source_type: windows_event, event_action: ["4624"]}
    match:
      any:
        - all:
            - {key: logontype, eq: "3"}
            - {key: authenticationpackagename, eq: NTLM}
            - {key: keylength, eq: "0"}
            - {key: targetusername, ne: ANONYMOUS LOGON}
        - all:
            - {key: logontype, eq: "9"}
            - {key: logonprocessname, eq: seclogo}
    group_by: [source_ip, host_name]
    evidence:
      - {label: 対象アカウント, key: targetusername}
      - {label: ログオン先, col: host_name}

  - id: win_suspicious_command
    name: "[Windows] 不審なコマンド実行"
    title: 不審なコマンド実行
    severity: high
    category: security
    description: >-
      プロセス作成(4688)で、エンコード済みPowerShell・資格情報窃取ツール・シャドウコピー削除・イベントログ消去など、攻撃でよく使われるコマンドを検出。コマンドラインの記録には監視対象側の監査ポリシー設定が必要。
    recommendation: >-
      実行したアカウント・親プロセスを確認し、正規の管理作業でなければ端末を隔離して調査。シャドウコピー削除・回復の無効化はランサムウェアの直前動作のことが多いので最優先で対応。
    scope: {source_type: windows_event, event_action: ["4688"]}
    match:
      # CommandLine は監視対象で「プロセス作成イベントにコマンドラインを含める」を有効にしないと出ない。
      # 未設定でも NewProcessName（実行ファイルパス）でツール名だけは拾える。
      key: [commandline, newprocessname]
      regex:
        - 'powershell.*\s-(e|ec|enc|encodedcommand)\s'          # エンコード済みコマンドの実行
        - 'frombase64string'
        - 'downloadstring|downloadfile|invoke-webrequest|invoke-expression|iex\s*\('
        - 'mimikatz|sekurlsa|lsadump|kerberos::'                 # 資格情報窃取ツール
        - 'comsvcs(\.dll)?.*minidump|procdump.*lsass'            # LSASSのメモリダンプ
        - 'vssadmin(\.exe)?\s+delete\s+shadows|wmic(\.exe)?\s+shadowcopy\s+delete|wbadmin(\.exe)?\s+delete'
        - 'bcdedit(\.exe)?\s+/set'                               # 回復の無効化（ランサムウェアの典型）
        - 'wevtutil(\.exe)?\s+cl\s'                              # イベントログの消去
        - 'certutil(\.exe)?.*-urlcache|bitsadmin(\.exe)?.*/transfer'
        - 'reg(\.exe)?\s+save\s+hklm\\(sam|system|security)'     # SAM/SYSTEMハイブの持ち出し
        - 'ntdsutil'
        - 'net1?(\.exe)?\s+(user|localgroup)\s.*/add'
    group_by: [host_name]
    evidence:
      - {label: コマンド, key: [commandline, newprocessname], limit: 2, truncate: 160}
      - {label: 実行者, key: subjectusername}

  - id: win_rdp_external
    name: "[Windows] 外部IPからのRDPログオン成功"
    title: 外部IPからのRDPログオン成功
    severity: high
    category: security
    description: グローバルIPからのリモートデスクトップ(4624 LogonType 10)でログオンに成功した。
    recommendation: >-
      接続元と利用者に心当たりが無ければ該当アカウントを無効化。RDPをインターネットへ直接公開せず、VPN経由・IP制限・NLA・MFAを導入。
    scope: {source_type: windows_event, event_action: ["4624"]}
    match:
      all:
        - {key: logontype, eq: "10"}
        - {col: source_ip, ip_global: true}
    group_by: [source_ip]
    evidence:
      - {label: アカウント, col: actor_user}
      - {label: ログオン先, col: host_name}

  - id: win_logon_failure_ip
    name: "[Windows] ログオン失敗の多発（送信元IP単位）"
    title: ログオン失敗の多発
    severity: high
    category: security
    description: 同一送信元IPからのWindowsログオン失敗(4625)が多発。
    recommendation: 該当IPを遮断。RDP/SMBの外部公開を見直し、アカウントロックアウトポリシーを設定。
    scope: {source_type: windows_event, event_action: ["4625"]}
    match: {col: source_ip, exists: true}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 対象アカウント数, col: actor_user, show: count}
      - {label: 対象アカウント, col: actor_user}

  - id: win_password_spray
    name: "[Windows] パスワードスプレーの疑い"
    title: パスワードスプレーの疑い
    severity: high
    category: security
    description: >-
      同一送信元IPから、多数の異なるアカウントへのログオン失敗(4625)。ロックアウトを避けて少数のパスワードを多数のアカウントに試す攻撃。
    recommendation: 該当IPを遮断。狙われたアカウントに弱いパスワードが無いか確認し、MFAを導入。
    scope: {source_type: windows_event, event_action: ["4625"]}
    match: {col: source_ip, exists: true}
    group_by: [source_ip]
    threshold: {distinct: {col: actor_user}, min_distinct: 5}
    evidence:
      - {label: 対象アカウント数, col: actor_user, show: count}
      - {label: 対象アカウント, col: actor_user}

  - id: win_kerberoasting
    name: "[Windows] Kerberoastingの疑い"
    title: Kerberoastingの疑い
    severity: high
    category: security
    description: >-
      RC4暗号(0x17)のKerberosサービスチケット要求(4769)。サービスアカウントのパスワードをオフラインで解読する攻撃で使われる（ドメインコントローラーのログでのみ出る）。
    recommendation: >-
      要求元のアカウント・端末を確認。サービスアカウントは25文字以上の長いパスワードかgMSAにし、RC4を無効化してAESのみにする。
    scope: {source_type: windows_event, event_action: ["4769"]}
    match:
      all:
        - {key: ticketencryptiontype, eq: "0x17"}
        - not: {key: servicename, endswith: "$"}   # コンピューターアカウント宛ては対象外
        - {key: servicename, ne: krbtgt}
    group_by: [source_ip, host_name]
    evidence:
      - {label: 要求されたサービス, key: servicename}
      - {label: 要求元, col: actor_user}

  - id: win_priv_group_add
    name: "[Windows] 特権グループへのメンバー追加"
    title: 特権グループへのメンバー追加
    severity: high
    category: security
    description: Administrators・Domain Admins・Remote Desktop Users 等の特権グループにメンバーが追加された(4728/4732/4756)。
    recommendation: 追加した操作者と追加されたアカウントを確認し、承認された変更でなければ直ちに取り消して調査。
    scope: {source_type: windows_event, event_action: ["4728", "4732", "4756"]}
    match:
      # 対象グループ名。日本語版Windowsでも組み込みグループ名は英語のまま
      key: targetusername
      regex: 'admins|administrators|operators|remote desktop users|remote management users|group policy creator owners'
    group_by: [host_name]
    evidence:
      - {label: グループ, key: targetusername}
      - {label: 追加されたメンバー, key: [membername, membersid]}
      - {label: 操作者, key: subjectusername}

  - id: win_account_created
    name: "[Windows] ユーザーアカウントの作成"
    title: ユーザーアカウントの作成
    severity: warning
    category: security
    description: ユーザーアカウントが作成された(4720)。攻撃者の永続化（裏口アカウント）でも使われる。
    recommendation: 作成者と作成されたアカウントが承認済みの作業か確認。心当たりが無ければ無効化して調査。
    scope: {source_type: windows_event, event_action: ["4720"]}
    group_by: [host_name]
    evidence:
      - {label: 作成されたアカウント, key: targetusername}
      - {label: 操作者, key: subjectusername}

  - id: win_service_installed
    name: "[Windows] サービスのインストール"
    title: サービスのインストール
    severity: warning
    category: security
    description: 新しいサービスがインストールされた(7045/4697)。PsExec等の横展開やマルウェアの永続化で使われる。
    recommendation: >-
      サービス名・実行ファイルパスを確認。一時フォルダ・ユーザーフォルダ上の実行ファイルや、cmd/powershellを直接起動するサービスは要注意。
    scope: {source_type: windows_event, event_action: ["7045", "4697"]}
    group_by: [host_name]
    evidence:
      - {label: サービス, key: servicename, limit: 2}
      - {label: 実行パス, key: imagepath, limit: 2}

  - id: win_scheduled_task
    name: "[Windows] タスクスケジューラへの登録"
    title: タスクスケジューラへの登録
    severity: warning
    category: security
    description: スケジュールされたタスクが作成された(4698)。マルウェアの永続化・遠隔実行で使われる。
    recommendation: タスク名と実行内容を確認し、承認されていない登録であれば削除して調査。
    scope: {source_type: windows_event, event_action: ["4698"]}
    group_by: [host_name]
    evidence:
      - {label: タスク, key: taskname}
      - {label: 登録者, key: subjectusername}

  - id: win_audit_policy_changed
    name: "[Windows] 監査ポリシーの変更"
    title: 監査ポリシーの変更
    severity: warning
    category: security
    description: システムの監査ポリシーが変更された(4719)。検知を逃れるために監査を無効化する攻撃がある。
    recommendation: 変更者と変更内容を確認し、意図しない変更であれば元に戻す。
    scope: {source_type: windows_event, event_action: ["4719"]}
    group_by: [host_name]
    evidence:
      - {label: 操作者, key: subjectusername}

  # ================================================================ GitLab（source=gitlab）
  # GitLab（Omnibus）のJSONログを NXLog から source=gitlab, class=gitlab で送る前提。
  # GitLabのイベントは source_type が付かない（判定ルールが無い）ため scope は source で絞る。
  # class で絞ると payload を全行展開することになり、受信量の多いGitLabでは重すぎる。
  # 下の3ルールは taxonomy.md v1.13 までのKEYだけで書いたもの（送信元IP単位の集約はしない）。

  - id: gitlab_failed_login
    name: "[GitLab] ログイン失敗の多発"
    title: GitLabのログイン失敗の多発
    severity: warning
    category: security
    description: >-
      GitLabへのログイン失敗（application_json.log の「Failed Login: username=… ip=…」）が多発している。パスワードの総当たりやパスワードスプレーの可能性がある。
    recommendation: >-
      証跡のユーザー名・IPを確認し、心当たりの無いIPからであれば遮断する。狙われているアカウントには2要素認証を必須にし、GitLabの「サインイン失敗時のロック」とRack Attackの制限が有効か確認する。
    scope: {source: gitlab}
    match: {key: message, startswith: "Failed Login:"}
    group_by: [source]
    threshold: {count: 5}
    evidence:
      - {label: 失敗内容, key: message, limit: 5, truncate: 120}
      - {label: 種類, key: message, show: count}

  - id: gitlab_server_error_burst
    name: "[GitLab] サーバエラー(5xx)の多発"
    title: GitLabのサーバエラー(5xx)の多発
    severity: warning
    category: operations
    description: GitLab（Rails・Workhorse・API）が5xxを多数返している。障害・リソース不足・依存サービス（DB/Redis/Gitaly）の停止の可能性がある。
    recommendation: >-
      gitlab-ctl status で各サービスの稼働を確認し、エラーの出ているURIと同時刻の ERROR ログから原因を特定する。ディスク・メモリの残量も確認する。
    scope: {source: gitlab}
    match:
      any:
        # Rails（production_json / api_json）・Workhorse は status にステータスコードが入る
        - {key: [status, statuscode], regex: '^5[0-9][0-9]$'}
        # nginx（gitlab_access.log）はJSONでなく1行がそのまま message に入る（"GET / HTTP/1.1" 502 ...）
        - {key: message, regex: 'HTTP/[0-9.]+" 5[0-9][0-9] '}
    group_by: [source]
    threshold: {count: 20}
    evidence:
      - {label: ステータス, key: [status, statuscode]}
      - {label: URI, key: uri, limit: 5, truncate: 120}
      - {label: nginx, key: message, limit: 3, truncate: 120}

  - id: gitlab_error_burst
    name: "[GitLab] ERRORログの多発"
    title: GitLabのERRORログの多発
    severity: warning
    category: operations
    description: GitLabの各コンポーネント（Rails・Sidekiq・Workhorse・Gitaly等）が ERROR / FATAL のログを多数出している。
    recommendation: >-
      証跡のメッセージから該当コンポーネントを特定し、gitlab-ctl tail で前後のログを確認する。バックグラウンドジョブ（Sidekiq）の失敗が続く場合は、ジョブのキュー滞留も確認する。
    scope: {source: gitlab}
    # Rails・Sidekiq は severity（ERROR）、Workhorse・Gitaly は level（error）にレベルが入る
    match: {key: [severity, level], in: [error, fatal]}
    group_by: [source]
    threshold: {count: 20}
    evidence:
      - {label: メッセージ, key: [message, msg], limit: 5, truncate: 120}
      - {label: 種類, key: [message, msg], show: count}

  # ---- 以下は taxonomy.md v1.14（GitLabのKEY追加）で使えるようになったKEYを使う。
  # remote_ip / ip_address / meta.remote_ip は正規化で source_ip に入るため、送信元IP単位で集約できる。
  # 対象ログ（audit_json / auth_json / production_json / api_json / Sidekiq）は NXLog で送る設定が必要。

  - id: gitlab_failed_login_ip
    name: "[GitLab] 同一IPからのログイン失敗の連続"
    title: GitLabへのログイン失敗の連続
    severity: high
    category: security
    description: >-
      同じ送信元IPからGitLabへのログイン失敗（audit_json.log の failed_login）が10件以上。パスワードの総当たりの可能性が高い。audit_json.log を送信していないと発火しない。
    recommendation: >-
      送信元IPを遮断し、狙われたアカウントのパスワード変更と2要素認証の有効化を確認する。GitLabの「サインイン失敗時のロック」とRack Attack（管理エリア > 設定 > ネットワーク > ユーザーとIPのレート制限）が有効か確認する。
    scope: {source: gitlab}
    match: {key: failed_login, exists: true}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 対象アカウント, key: [author_name, target_details], limit: 5}
      - {label: 認証方式, key: failed_login}

  - id: gitlab_password_spray
    name: "[GitLab] パスワードスプレーの疑い"
    title: GitLabへのパスワードスプレーの疑い
    severity: high
    category: security
    description: >-
      同じ送信元IPから、5個以上の異なるアカウントへのログイン失敗（audit_json.log の failed_login）。よくあるパスワードを多数のアカウントに試す攻撃の可能性がある。
    recommendation: >-
      送信元IPを遮断し、対象アカウントに弱いパスワードが無いか確認する。全ユーザーへの2要素認証の必須化を検討する。
    scope: {source: gitlab}
    match: {key: failed_login, exists: true}
    group_by: [source_ip]
    threshold: {distinct: {key: [author_name, target_details]}, min_distinct: 5}
    evidence:
      - {label: 対象アカウント, key: [author_name, target_details], limit: 5}
      - {label: アカウント数, key: [author_name, target_details], show: count}

  - id: gitlab_rack_attack
    name: "[GitLab] レート制限・遮断の発動"
    title: GitLabのレート制限・遮断の発動
    severity: warning
    category: security
    description: >-
      GitLabのRack Attack（auth_json.log）が、同じ送信元IPに対してレート制限（throttle）または遮断（blocklist）を10回以上発動した。総当たり・スクレイピング・過剰なAPI呼び出しの可能性がある。CI等の正規の大量アクセスでも出ることがある。
    recommendation: >-
      送信元IPと一致した制限名（matched）を確認する。社内のCIや連携ツールなら制限値の調整を、心当たりが無ければ送信元IPの遮断を検討する。
    scope: {source: gitlab}
    match: {key: env, in: [throttle, blocklist]}
    group_by: [source_ip]
    threshold: {count: 10}
    evidence:
      - {label: 一致した制限, key: matched}
      - {label: パス, key: path, limit: 5, truncate: 120}

  - id: gitlab_api_auth_failure
    name: "[GitLab] APIの認証失敗の多発"
    title: GitLab APIの認証失敗の多発
    severity: warning
    category: security
    description: >-
      同じ送信元IPから、GitLab API（/api/）への 401（未認証）/ 403（権限なし）が20件以上。アクセストークンの総当たりや、失効したトークンを使い続けている連携ツールの可能性がある。
    recommendation: >-
      送信元IPとUser-Agentから送信元を特定する。社内のツールならトークンを更新し、心当たりが無ければ送信元IPを遮断する。
    scope: {source: gitlab}
    match:
      all:
        - {key: path, startswith: /api/}
        - {key: status, in: ["401", "403"]}
    group_by: [source_ip]
    threshold: {count: 20}
    evidence:
      - {label: ステータス, key: status}
      - {label: パス, key: [route, path], limit: 5, truncate: 120}
      - {label: User-Agent, key: [ua, user_agent], limit: 3, truncate: 120}

  - id: gitlab_admin_external
    name: "[GitLab] 外部IPからの管理エリアへのアクセス"
    title: 外部IPからのGitLab管理エリアへのアクセス
    severity: warning
    category: security
    description: >-
      グローバルIPから GitLab の管理エリア（/admin）へのアクセスがあった。管理者アカウントが乗っ取られている場合や、管理画面が外部に公開されている場合に出る。管理者が社外から正規に操作した場合も出る。
    recommendation: >-
      アクセスしたユーザーと送信元IPが想定どおりか確認する。管理エリアは社内ネットワークやVPN経由に限定することを検討する。
    scope: {source: gitlab}
    match:
      all:
        - {key: path, startswith: /admin}
        - {col: source_ip, ip_global: true}
    group_by: [source_ip]
    evidence:
      - {label: ユーザー, key: [username, meta.user], limit: 3}
      - {label: パス, key: path, limit: 5, truncate: 120}
      - {label: ステータス, key: status}

  - id: gitlab_job_failed
    name: "[GitLab] バックグラウンドジョブの失敗の多発"
    title: GitLabのバックグラウンドジョブ(Sidekiq)の失敗の多発
    severity: warning
    category: operations
    description: GitLabのバックグラウンドジョブ（Sidekiq）の失敗（job_status=fail）が10件以上。メール送信・CI・ミラー・ハウスキーピング等が止まっている可能性がある。
    recommendation: >-
      証跡の例外クラスから原因を確認する。管理エリア > モニタリング > バックグラウンドジョブ で失敗・再試行待ちのジョブを確認し、Redis・DB・ディスクの状態も確認する。
    scope: {source: gitlab}
    match: {key: job_status, eq: fail}
    group_by: [source]
    threshold: {count: 10}
    evidence:
      - {label: 例外, key: exception.class, limit: 5}
      - {label: メッセージ, key: [message, exception.message], limit: 3, truncate: 120}
